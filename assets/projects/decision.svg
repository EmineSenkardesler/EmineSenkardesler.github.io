<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Abstract grid path for a crop decision support system</title>
<style>
  .bg { fill: #eef2f9; }
  .ink { stroke: #13294b; fill: none; }
  .fill { fill: #13294b; }
  .soft { stroke: #13294b; fill: none; opacity: 0.35; }
  .accent { stroke: #e84a27; fill: none; }
  .accent-fill { fill: #e84a27; }
  .teal { stroke: #2a6f7a; fill: none; }
  .teal-fill { fill: #2a6f7a; opacity: 0.18; }
  .band { fill: #13294b; opacity: 0.08; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a2436; }
    .ink { stroke: #8fb4ee; }
    .fill { fill: #8fb4ee; }
    .soft { stroke: #8fb4ee; }
    .accent { stroke: #ff7a59; }
    .accent-fill { fill: #ff7a59; }
    .teal { stroke: #7ec8d0; }
    .teal-fill { fill: #7ec8d0; opacity: 0.22; }
    .band { fill: #8fb4ee; opacity: 0.10; }
  }
</style>
<rect class="bg" width="800" height="450"/>

  <!-- base grid -->
  <g class="soft" stroke-width="0.9">
  <line x1="40" y1="40" x2="40" y2="410"/>
